@if (supported()) {
  <shared-settings-section
    [heading]="'macrodeck.app:Settings.Startup.BackgroundHeading' | translate"
    [description]="'macrodeck.app:Settings.Startup.BackgroundDescription' | translate">
    <shared-settings-row
      [label]="'macrodeck.app:Settings.Startup.HideDockIconLabel' | translate"
      [description]="'macrodeck.app:Settings.Startup.HideDockIconDescription' | translate">
      <shared-toggle-switch
        [ariaLabel]="'macrodeck.app:Settings.Startup.HideDockIconLabel' | translate"
        [busy]="busy()"
        [disabled]="busy()"
        [checked]="enabled()"
        (changed)="setEnabled($event)" />
    </shared-settings-row>
  </shared-settings-section>
}
