<shared-side-panel
  [isOpen]="isOpen()"
  [heading]="appStrings.Nav.Notifications | translate"
  [closeLabel]="appStrings.Shell.Notifications.Close | translate"
  (closed)="closed.emit()">
  @if (notificationCenter.hasDismissable()) {
    <button sidePanelActions type="button" class="np-header-btn" (click)="onClearAll()">{{ appStrings.Shell.Notifications.ClearAll | translate }}</button>
  }

  <div class="np-body">
    @if (notifications().length === 0) {
      <shared-empty-state
        compact
        icon="bell"
        [heading]="appStrings.Shell.Notifications.EmptyHeading | translate"
        [message]="appStrings.Shell.Notifications.EmptyMessage | translate" />
    } @else {
      <div class="np-list">
        @for (notification of notifications(); track notification.id) {
          <app-notification-item
            [notification]="notification"
            (action)="onAction($event)"
            (dismissed)="onDismiss($event)"
            (cancel)="onCancel($event)" />
        }
      </div>
    }
  </div>
</shared-side-panel>
