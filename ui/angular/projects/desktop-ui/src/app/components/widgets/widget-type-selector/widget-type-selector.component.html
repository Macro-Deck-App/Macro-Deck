<shared-modal [heading]="'macrodeck.app:Widgets.TypeSelector.Heading' | translate" [showFooter]="true" maxWidth="760px" (close)="cancel.emit()">
  <div class="toolbar">
    <shared-input
      class="search"
      type="search"
      [autofocus]="true"
      [placeholder]="'macrodeck.app:Widgets.TypeSelector.SearchPlaceholder' | translate"
      [ariaLabel]="'macrodeck.app:Widgets.TypeSelector.SearchAriaLabel' | translate"
      [ngModel]="query()"
      (ngModelChange)="query.set($event)" />
    <shared-segmented-control
      class="view-toggle"
      [options]="viewOptions()"
      [value]="view()"
      [ariaLabel]="'macrodeck.app:Widgets.TypeSelector.ViewLabel' | translate"
      (valueChange)="setView($event)" />
  </div>

  <div class="widget-types" #grid [class.list]="view() === 'list'">
    @for (option of sortedTypes(); track option.id) {
      <div class="type-card" [class.favorite]="isFavorite(option)" [hidden]="!matches(option)">
        <button class="type-select" type="button" [attr.aria-label]="name(option)" (click)="selectType(option.id)">
          <span class="type-preview" #previewBox>
            <shared-ui-tree-widget
              #preview
              class="type-preview-widget"
              [widgetType]="option.id"
              [sample]="true"
              [width]="previewCell"
              [height]="previewCell"
              [style.width.px]="previewCell"
              [style.height.px]="previewCell"
              [style.margin-right.px]="previewSize() - previewCell"
              [style.margin-bottom.px]="previewSize() - previewCell"
              [style.transform]="'scale(' + previewScale() + ')'"
              [disabled]="true"
              [style.--wq.px]="previewCell"
              [style.--widget-scale]="1"
              [style.--widget-radius.px]="previewRadius">
            </shared-ui-tree-widget>
            @if (preview.rejected()) {
              <span class="type-preview-placeholder">{{ 'macrodeck.app:WebClient.Widgets.NoPreview' | translate }}</span>
            }
          </span>
          <span class="type-info">
            <span class="type-name">{{ name(option) }}</span>
            @if (providerLabel(option); as provider) {
              <span class="type-provider">{{ provider }}</span>
            }
            <span class="type-description">{{ description(option) }}</span>
          </span>
        </button>
        <button
          #starButton
          class="type-favorite"
          type="button"
          [attr.data-type-id]="option.id"
          [class.active]="isFavorite(option)"
          [attr.aria-pressed]="isFavorite(option)"
          [attr.aria-label]="favoriteLabel(option)"
          [title]="favoriteLabel(option)"
          (click)="toggleFavorite(option, starButton)">
          <svg viewBox="0 0 24 24" aria-hidden="true" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [attr.fill]="isFavorite(option) ? 'currentColor' : 'none'">
            <path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/>
          </svg>
        </button>
      </div>
    }
    @if (noMatches()) {
      <p class="no-matches" role="status">{{ 'macrodeck.app:Widgets.TypeSelector.NoMatches' | translate }}</p>
    }
  </div>

  <div modal-footer>
    <shared-button variant="secondary" (click)="onCancel()">{{ 'macrodeck:Common.Cancel' | translate }}</shared-button>
  </div>
</shared-modal>
