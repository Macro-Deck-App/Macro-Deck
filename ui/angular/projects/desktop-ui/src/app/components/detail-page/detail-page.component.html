<div #surface class="dp-surface" [class.dp-leaving]="leaving()" (animationend)="onSurfaceAnimationEnd($event)">
  <header class="dp-topbar">
    <button type="button" class="dp-back" [attr.aria-label]="backLabel" (click)="requestClose()">
      <span class="icon icon-arrow-left icon-md" aria-hidden="true"></span>
    </button>
    <ng-content select="[detailPageHeader]" />
  </header>

  <div class="dp-body">
    <ng-content />
  </div>

  <ng-content select="[detailPageOverlay]" />
</div>
