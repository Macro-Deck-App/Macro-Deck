<div class="cap-panel">
  @if (loader.loading()) {
    <shared-loading-state [message]="'macrodeck.app:Integrations.Detail.Batteries.Loading' | translate" />
  } @else if (loader.error(); as error) {
    <shared-error-banner [message]="error" (dismiss)="loader.error.set(null)" />
  } @else if (loader.data(); as data) {
    @if (rows().length > 0) {
      <ul class="cap-rows" [attr.aria-label]="'macrodeck.app:Integrations.Capability.BatteryProvider' | translate">
        @for (row of rows(); track row.battery.id) {
          <li>
            <shared-variable-row
              class="battery-row"
              [primary]="row.battery.name"
              [primaryMono]="false"
              [secondary]="row.details"
              [value]="row.battery.isConnected ? row.level : null">
              <span row-meta class="availability-pill" [class]="'availability-' + row.stateTone">{{ row.state }}</span>
              @if (row.health) {
                <span row-meta class="availability-pill availability-Unavailable">{{ row.health }}</span>
              }
            </shared-variable-row>
          </li>
        }
      </ul>
    } @else if (!data.available) {
      <shared-empty-state
        icon="battery"
        [heading]="'macrodeck.app:Integrations.Detail.CapabilityUnavailableHeading' | translate"
        [message]="'macrodeck.app:Integrations.Detail.CapabilityUnavailableMessage' | translate" />
    } @else {
      <shared-empty-state
        icon="battery"
        [heading]="'macrodeck.app:Integrations.Detail.Batteries.EmptyHeading' | translate"
        [message]="'macrodeck.app:Integrations.Detail.Batteries.EmptyMessage' | translate" />
    }
  }
</div>
