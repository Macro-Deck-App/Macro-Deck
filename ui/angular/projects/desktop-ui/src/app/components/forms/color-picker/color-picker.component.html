@if (label()) {
  <label class="cp-label">{{ label() }}</label>
}

<div class="cp-track" role="group" [attr.aria-label]="pickerAriaLabel()">
  @if (showsReset()) {
    <button
      class="cp-cell cp-reset"
      type="button"
      [title]="defaultColorTitle()"
      [attr.aria-label]="resetAriaLabel()"
      (click)="select(effectiveResetValue()!)">
      <svg
        class="cp-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
        <path d="M21 3v5h-5" />
      </svg>
    </button>
  }

  @for (preset of effectivePresets(); track preset.value) {
    <button
      class="cp-cell cp-swatch"
      type="button"
      [class.cp-selected]="value() === preset.value"
      [style.--cp-fill]="preset.value"
      [title]="preset.label"
      [attr.aria-pressed]="value() === preset.value"
      [attr.aria-label]="preset.label"
      (click)="select(preset.value)">
      @if (value() === preset.value) {
        <svg class="cp-check" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M20 6 9 17l-5-5"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      }
    </button>
  }

  @if (allowCustom()) {
    <button
      #customTrigger
      class="cp-cell cp-custom"
      type="button"
      aria-haspopup="dialog"
      [class.cp-selected]="isCustom()"
      [title]="customColorTitle()"
      [attr.aria-label]="customColorTitle()"
      [attr.aria-expanded]="isPickerOpen()"
      [style.--cp-fill]="isCustom() ? customFill() : null"
      (click)="togglePicker()">
      @if (!isCustom()) {
        <svg
          class="cp-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">
          <path d="M5 12h14" />
          <path d="M12 5v14" />
        </svg>
      }
    </button>

    <shared-overlay-panel
      [anchor]="customTrigger"
      [isOpen]="isPickerOpen()"
      [maxHeight]="null"
      (dismissed)="closePicker()">
      <div class="cp-popover" role="dialog" [attr.aria-label]="customColorTitle()">
        <div
          class="cp-area"
          tabindex="0"
          role="slider"
          aria-valuemin="0"
          aria-valuemax="100"
          [style.--cp-hue]="hueColor()"
          [attr.aria-label]="areaAriaLabel()"
          [attr.aria-valuenow]="saturationPercent()"
          [attr.aria-valuetext]="hexText()"
          (pointerdown)="onAreaPointerDown($event)"
          (pointermove)="onAreaPointerMove($event)"
          (keydown)="onAreaKeydown($event)">
          <div
            class="cp-area-thumb"
            [style.left.%]="saturationPercent()"
            [style.top.%]="100 - brightnessPercent()"
            [style.--cp-fill]="customFill()"></div>
        </div>

        <input
          class="cp-hue"
          type="range"
          min="0"
          max="360"
          step="1"
          [attr.aria-label]="hueAriaLabel()"
          [value]="hsv().h"
          (input)="onHueInput($event)">

        <div class="cp-row">
          <input
            class="cp-hex"
            type="text"
            spellcheck="false"
            autocomplete="off"
            maxlength="7"
            [attr.aria-label]="hexAriaLabel()"
            [value]="hexText()"
            (input)="onHexInput($event)"
            (blur)="onHexBlur()">

          @if (supportsEyedropper) {
            <button
              class="cp-eyedropper"
              type="button"
              [title]="eyedropperLabel()"
              [attr.aria-label]="eyedropperLabel()"
              (click)="pickFromScreen()">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true">
                <path
                  d="m12 9-8.414 8.414A2 2 0 0 0 3 18.828v1.344a2 2 0 0 1-.586 1.414A2 2 0 0 1 3.828 21h1.344a2 2 0 0 0 1.414-.586L15 12" />
                <path d="m18 9 .4.4a1 1 0 1 1-3 3l-3.8-3.8a1 1 0 1 1 3-3l.4.4 3.4-3.4a1 1 0 1 1 3 3z" />
                <path d="m2 22 .414-.414" />
              </svg>
            </button>
          }
        </div>
      </div>
    </shared-overlay-panel>
  }
</div>
