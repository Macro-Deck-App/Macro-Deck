    license: LicenseRef-MacroDeck-Branding
    copyright: Copyright (c) 2026 Radioactive.exe
    licenseFile: third-party/licenses/Macro-Deck-Branding.txt
    reviewed: Exclusive asset license from the logo's creator to the Macro Deck project; excluded from Apache-2.0.
    notice: |
      The Macro Deck name, logo and branding assets are not licensed under the Apache License 2.0.
      Copyright (c) 2026 Radioactive.exe, licensed exclusively to the Macro Deck project; all other rights
      reserved. Forks and derived products must not use the Macro Deck name or logo.
    paths:
      - ui/bootstrapper/icons/128x128.png
      - ui/bootstrapper/icons/128x128@2x.png
