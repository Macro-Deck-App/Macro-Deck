  - name: Dashboard Icons
    url: https://github.com/homarr-labs/dashboard-icons
    license: Apache-2.0
    copyright: Dashboard Icons contributors
    note: >-
      Logos of the Discord, Home Assistant, Spotify, Twitch and YouTube Music integrations, and the Windows logo
      marking the platforms a Store package supports. The logos are trademarks of their respective owners and are
      used to identify the integration or platform only.
    paths:
      - host/src/MacroDeckHost.Integrations/Discord/discord-icon.svg
      - host/src/MacroDeckHost.Integrations/HomeAssistant/home-assistant-icon.svg
      - host/src/MacroDeckHost.Integrations/Spotify/spotify-icon.svg
      - host/src/MacroDeckHost.Integrations/Twitch/twitch-icon.svg
      - host/src/MacroDeckHost.Integrations/YtmDesktop/ytmdesktop-icon.svg
      - ui/runtime/styles/icons/windows.svg

  - name: Android robot
    url: https://developer.android.com/distribute/marketing-tools/brand-guidelines
    license: CC-BY-3.0
    copyright: Google LLC
    licenseFile: third-party/licenses/CC-BY-3.0.txt
    note: >-
      Icon of the ADB integration, taken from Dashboard Icons. The Android robot is reproduced or modified from
      work created and shared by Google and used according to terms described in the Creative Commons 3.0
      Attribution License.
    paths:
      - host/src/MacroDeckHost.Integrations/Adb/adb-icon.svg

  - name: Simple Icons (Discord glyph)
    url: https://github.com/simple-icons/simple-icons
    license: CC0-1.0
    licenseFile: third-party/licenses/CC0-1.0.txt
    note: Discord glyph of the configuration UI and web client icon set.
    paths:
      - ui/runtime/styles/icons/discord.svg

  - name: Simple Icons (operating system logos)
    url: https://github.com/simple-icons/simple-icons
    license: CC0-1.0
    licenseFile: third-party/licenses/CC0-1.0.txt
    note: >-
      Apple and Linux logos marking the platforms a Store package supports. The logos are trademarks of their
      respective owners and are used to identify the platform only.
    paths:
      - ui/runtime/styles/icons/apple.svg
      - ui/runtime/styles/icons/linux.svg

  - name: Product logos of integrated applications
    license: LicenseRef-Trademark-Identification
    licenseFile: third-party/licenses/Trademark-Identification.txt
    reviewed: >-
      Logos of the applications Macro Deck integrates with, shown only to identify the integration. The SinusBot
      file carries a no-redistribution notice from WebAilesi; the maintainer is asking the SinusBot developer for
      permission.
    note: OBS Studio, Streamer.bot, Meld, Streamlabs Desktop and SinusBot logos. Trademarks of their respective owners.
    paths:
      - host/src/MacroDeckHost.Integrations/Obs/obs-icon.svg
      - host/src/MacroDeckHost.Integrations/Streamerbot/streamerbot-icon.svg
      - host/src/MacroDeckHost.Integrations/Meld/meld-icon.svg
      - host/src/MacroDeckHost.Integrations/StreamlabsDesktop/streamlabs-icon.png
      - host/src/MacroDeckHost.Integrations/SinusBot/sinusbot-icon.svg

  - name: Weather icons (Makin-Things/weather-icons)
    url: https://github.com/Makin-Things/weather-icons
    license: MIT
    licenseFile: host/src/MacroDeckHost.Widgets/Weather/Icons/LICENSE
    note: Weather widget icons, embedded in the host. Artwork (c) ammap.com.
    paths:
