name: NuGet publish

# Pushes an already-packed package artifact to nuget.org. Reusable so the manual NuGet workflow and the
# release build publish through exactly the same steps, and so this is the only job in the repository
# that ever holds a publishing credential.
#
# This file must stay the ONLY place NuGet/login appears. Trusted publishing validates the workflow file
# in which the login step actually runs, so a single nuget.org policy naming nuget-publish.yml covers
# every caller; inlining a login step into a calling workflow would silently need a policy of its own.

on:
  workflow_call:
    inputs:
      version:
        description: Version the artifact was packed at - verified before anything is pushed
        type: string
        required: true
      artifact:
        description: Name of the artifact holding the .nupkg/.snupkg files
        type: string
        default: nuget-packages
      require_credentials:
        description: Fail instead of skipping when no nuget.org credential is configured. The manual workflow sets this - publishing is its whole purpose - while a release skips, so forks and pre-setup runs still produce a release.
        type: boolean
        default: false
    secrets:
      NUGET_USER:
        description: nuget.org account (profile) name that owns the trusted publishing policy
        required: false

env:
  NODE_VERSION: 22
  DOTNET_VERSION: 10.0.x

jobs:
  publish:
    name: Publish to NuGet
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      # Lets the job request the OIDC token nuget.org exchanges for a short-lived API key.
      id-token: write
    steps:
      # secrets are not available to a job-level if, so the gate is a step that exports the decision.
      - name: Check nuget.org credentials
        id: credentials
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
          REQUIRE_CREDENTIALS: ${{ inputs.require_credentials }}
        run: |
          set -euo pipefail
          if [ -n "${NUGET_USER}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          if [ "${REQUIRE_CREDENTIALS}" = "true" ]; then
            echo "::error::NUGET_USER is not configured, so nothing can be published."
            exit 1
          fi
          echo "::warning::NUGET_USER is not configured - skipping the NuGet push. The packages remain available as a workflow artifact."

      - uses: actions/checkout@v5
        if: ${{ steps.credentials.outputs.configured == 'true' }}

      - uses: actions/setup-dotnet@v6
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # For ci/scripts/verify-nuget-packages.mjs below.
      - uses: actions/setup-node@v7
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download packages
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/packages

      # The artifact was verified when it was packed; re-checking here is what makes the version input
      # meaningful - a caller wiring the wrong artifact or version fails before anything is pushed,
      # because a push to nuget.org cannot be taken back.
      - name: Verify packages
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        run: node ci/scripts/verify-nuget-packages.mjs "${{ runner.temp }}/packages" "${{ inputs.version }}"

      # As late as possible: the issued key is valid for one hour, and one token yields one key.
      - name: NuGet login
        id: login
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Only *.nupkg is pushed: the client uploads the sibling .snupkg automatically, and pushing it a
      # second time would come back as a 409. No --skip-duplicate - a version that is already published
      # must fail the run rather than pass silently.
      - name: Push packages
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE_DIR: ${{ runner.temp }}/packages
        run: |
          set -euo pipefail
          for package in "${PACKAGE_DIR}"/*.nupkg; do
            echo "Pushing $(basename "${package}")"
            dotnet nuget push "${package}" \
              --api-key "${NUGET_API_KEY}" \
              --source https://api.nuget.org/v3/index.json
          done

      - name: Summarize
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        env:
          PACKAGE_DIR: ${{ runner.temp }}/packages
        run: |
          {
            echo "## Published to NuGet"
            echo
            echo "Version \`${{ inputs.version }}\` from artifact \`${{ inputs.artifact }}\`."
            echo
            for package in "${PACKAGE_DIR}"/*.nupkg; do
              echo "- \`$(basename "${package}")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
