name: Publish Release

# Publishes a successful release build: the GitHub release carries the installers and the
# signed updater payloads, the R2 feed carries only the channel manifests pointing at them,
# and the NuGet packages go to nuget.org only - never onto the release - last, once the
# release they belong to actually exists.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run to publish (run id of a successful Build on main)
        required: true
        type: string

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish GitHub release
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    # The release announcement webhook and the R2 credentials are production environment secrets.
    environment: production
    outputs:
      version: ${{ steps.release.outputs.version }}
      run_id: ${{ inputs.run_id || github.event.workflow_run.id }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v5

      # A manual run names the build run instead of being triggered by it, so the same
      # guarantees the workflow_run filter gives are asserted here before anything is published.
      - name: Resolve source build run
        run: |
          set -euo pipefail
          read -r name conclusion event branch sha < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
              --jq '[.name, .conclusion, .event, .head_branch, .head_sha] | @tsv'
          )

          if [ "$name" != 'Build' ] || [ "$conclusion" != 'success' ] || [ "$event" != 'workflow_dispatch' ] || [ "$branch" != 'main' ]; then
            echo "Run $SOURCE_RUN_ID is not a successful manual Build on main (workflow=$name, conclusion=$conclusion, event=$event, branch=$branch)." >&2
            exit 1
          fi

          echo "TARGET_SHA=$sha" >> "$GITHUB_ENV"

      # For ci/scripts/point-manifests-at-release.mjs below.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: macro-deck-*
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      # Same artifact the update manifests embed their notes from, so the
      # release body and the changelog in the update feed cannot drift apart.
      - name: Download release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: release-notes
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Resolve release version
        id: release
        run: |
          manifest=$(find release-assets -type f \( -name 'latest-windows.json' -o -name 'beta-windows.json' \) | head -n 1)
          if [ -z "$manifest" ]; then
            echo "No Windows update manifest found in build artifacts." >&2
            exit 1
          fi

          version=$(jq -r '.version // empty' "$manifest")
          if [ -z "$version" ]; then
            echo "Could not resolve release version from $manifest." >&2
            exit 1
          fi

          tag="v${version}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing $tag from build run $SOURCE_RUN_ID at $TARGET_SHA"

      # Draft first, published last: releases in this repository are immutable, so a tag is
      # spent the moment its release goes out. Uploading into a draft keeps a failed upload
      # retryable, and the release only becomes visible once it carries every asset.
      - name: Create draft release
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$draft" != 'true' ]; then
              echo "Release $TAG already exists." >&2
              exit 1
            fi
            # A draft never reached anyone and holds no tag, so a failed run's leftover is
            # replaced rather than blocking the retry it exists for.
            echo "Replacing the leftover draft for $TAG."
            gh release delete "$TAG" --yes
          fi

          args=(
            "$TAG"
            --draft
            --target "$TARGET_SHA"
            --title "Macro Deck $VERSION"
            --notes-file release-notes/release-notes.md
          )

          if [ "$PRERELEASE" = 'true' ]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"

      - name: Upload release assets
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("$asset")
          done < <(
            find release-assets -type f \
              \( -name '*.exe' \
              -o -name '*.dmg' \
              -o -name '*.AppImage' \
              -o -name '*.sha256' \
              -o -name '*.deb' \
              -o -name '*.rpm' \
              -o -name '*.app.tar.gz' \) \
              -print0
          )

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found." >&2
            exit 1
          fi

          # A single flaky upload used to cost the whole version; --clobber makes a retry
          # resume over whatever the previous attempt already got through.
          for attempt in 1 2 3; do
            if gh release upload "$TAG" "${assets[@]}" --clobber; then
              exit 0
            fi
            echo "::warning::Asset upload attempt $attempt failed."
            sleep $((attempt * 15))
          done

          echo "Could not upload the release assets after 3 attempts." >&2
          exit 1

      # The point of no return: from here the tag is spent and the release is public.
      - name: Publish release
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

      # GitHub sanitizes asset names on upload, so the urls the build wrote are only
      # provisional; this rewrites them to the assets the release actually carries and
      # fails when a platform has no downloadable payload.
      - name: Point channel manifests at the release
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view "$TAG" --json assets > release-assets.json
          node ci/scripts/point-manifests-at-release.mjs release-assets release-assets.json

      # Only the manifests are served from the feed - the payloads they name live on the
      # GitHub release. They are overwritten every release and drive update detection, so
      # they must always be revalidated, never cached.
      - name: Publish channel manifests to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID}" ]; then
            echo "::warning::R2 credentials not configured - the release is published but no client will be offered it."
            exit 0
          fi
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          dest="s3://${R2_BUCKET}/releases/"
          echo "Publishing ${VERSION} channel manifests to ${dest}"
          while IFS= read -r -d '' manifest; do
            name="$(basename "${manifest}")"
            aws s3 cp "${manifest}" "${dest}${name}" \
              --content-type "application/json" \
              --cache-control "no-cache" \
              --endpoint-url "${endpoint}" \
              --no-progress
            # What every installed client resolves is this exact key, so assert it is
            # really there before calling the release published.
            aws s3api head-object \
              --bucket "${R2_BUCKET}" \
              --key "releases/${name}" \
              --endpoint-url "${endpoint}" > /dev/null
            echo "Reachable through the feed: releases/${name}"
          done < <(find release-assets -maxdepth 1 -type f \( -name 'latest-*.json' -o -name 'beta-*.json' \) -print0)

      - name: Notify Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_RELEASES }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL_RELEASES is not configured; skipping Discord notification."
            exit 0
          fi

          release_url=$(gh release view "$TAG" --json url --jq '.url')

          jq -n \
            --arg title "Macro Deck $VERSION released" \
            --arg url "$release_url" \
            --arg description "A new Macro Deck release is available. See the GitHub release for the full changelog and downloads." \
            '{embeds: [{title: $title, url: $url, description: $description}]}' > discord-payload.json

          curl --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --header "Content-Type: application/json" \
            --data @discord-payload.json \
            "$DISCORD_WEBHOOK_URL"

  # Their own jobs rather than steps on publish: an AUR or APT failure must not fail the release after
  # it is out, nor skip publish-nuget, which gates on publish succeeding.
  publish-aur:
    name: Publish AUR packages
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/publish-aur.yml
    with:
      version: ${{ needs.publish.outputs.version }}
    secrets: inherit

  publish-apt:
    name: Publish APT repository
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/publish-apt.yml
    with:
      version: ${{ needs.publish.outputs.version }}
    secrets: inherit

  # Last, and only once the release exists: a package on nuget.org cannot be taken back, so it
  # must never be published for a release that failed to be created. It is also the one publishing
  # step allowed to fail - the release is already out, and the packages can be pushed afterwards
  # from nuget.yml at the same version.
  publish-nuget:
    name: Publish NuGet packages
    needs: publish
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/nuget-publish.yml
    with:
      version: ${{ needs.publish.outputs.version }}
      run_id: ${{ needs.publish.outputs.run_id }}
      allow_failure: true
    secrets:
      NUGET_USER: ${{ secrets.NUGET_USER }}
