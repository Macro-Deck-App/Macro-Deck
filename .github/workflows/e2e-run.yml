# The E2E suite itself. Called by e2e.yml for a manual run, by ci.yml on every change, and by
# build.yml before a release publishes - one definition so those three can never drift apart.
name: E2E run

on:
  workflow_call:
    inputs:
      suite:
        description: E2E suite to run - all, or smoke for the @smoke subset
        type: string
        required: false
        default: all
      filter:
        description: Optional Playwright test file filter
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  # Exact, equal to global.json: a floating 10.0.x outruns the release metadata the bundled
  # runtime is resolved from (ci/scripts/resolve-dotnet-runtime.mjs).
  DOTNET_VERSION: 10.0.402
  # The Angular CLI declares a node floor of 22.22.3, and a bare major can resolve below it.
  NODE_VERSION: '^22.22.3'
  BUILD_CHANNEL: Production

jobs:
  e2e:
    name: Core E2E
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-e2e-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-e2e-${{ runner.os }}-

      - name: Build production UIs
        working-directory: ui
        run: |
          npm ci
          npm run build
          npm run build:web-client

      - name: Stage production host
        run: ./ci/scripts/stage-host.sh linux-x64 "3.0.0-e2e.${{ github.run_number }}" "${{ env.BUILD_CHANNEL }}"

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Plays the bootstrapper's part for every spec file: each starts its own staged host with its own
      # data directory, ports, temp directory and loopback secret (e2e/tests/support/host.js).
      - name: Run Playwright E2E tests
        working-directory: e2e
        env:
          MACRO_DECK_HOST_BINARY: ${{ github.workspace }}/ui/bootstrapper/host-publish/Macro Deck Host
          E2E_RUN_DIR: ${{ runner.temp }}/e2e-run
          E2E_SECRETS_FILE: ${{ runner.temp }}/e2e-loopback-secrets.txt
          SUITE: ${{ inputs.suite }}
          FILTER: ${{ inputs.filter }}
        shell: bash
        run: |
          args=()
          if [[ "$SUITE" == "smoke" ]]; then
            args+=(--grep '@smoke')
          fi
          if [[ -n "$FILTER" ]]; then
            args+=("$FILTER")
          fi
          npx playwright test "${args[@]}"

      # Only the host and supervisor logs leave the run directory: the data directories hold key material.
      - name: Collect host logs
        if: always()
        run: |
          mkdir -p e2e/host-logs
          for log in "${{ runner.temp }}"/e2e-run/*/macro-deck-host*.log; do
            [[ -f "$log" ]] || continue
            cp "$log" "e2e/host-logs/$(basename "$(dirname "$log")")-$(basename "$log")"
          done

      - name: Redact Playwright diagnostics
        id: redact
        if: always()
        env:
          E2E_PASSWORD: macro-deck-e2e-password
          E2E_SECRETS_FILE: ${{ runner.temp }}/e2e-loopback-secrets.txt
        run: python3 e2e/scripts/redact-playwright-artifacts.py e2e/test-results e2e/playwright-report e2e/host-logs

      - name: Upload E2E diagnostics
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/host-logs/

      - name: Write run summary
        if: always()
        run: |
          {
            echo '## Macro Deck E2E'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Suite: \`${{ inputs.suite }}\`"
            echo "- Filter: \`${{ inputs.filter || 'none' }}\`"
            echo "- Data root: one isolated host per spec file under the runner temp directory"
            echo "- Host build channel: \`${{ env.BUILD_CHANNEL }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
