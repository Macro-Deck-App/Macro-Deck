# The E2E suite itself. Called by e2e.yml, ci.yml, build.yml and, per desktop OS, e2e-cross.yml:
# one definition so its callers can never drift apart.
name: E2E run

on:
  workflow_call:
    inputs:
      suite:
        description: E2E suite to run - all, or smoke for the @smoke subset
        type: string
        required: false
        default: all
      filter:
        description: Optional Playwright test file filter
        type: string
        required: false
        default: ''
      os:
        description: Runner OS - linux, windows or macos
        type: string
        required: false
        default: linux

permissions:
  contents: read

env:
  # Exact, equal to global.json: a floating 10.0.x outruns the release metadata the bundled
  # runtime is resolved from (ci/scripts/resolve-dotnet-runtime.mjs).
  DOTNET_VERSION: 10.0.402
  # The Angular CLI declares a node floor of 22.22.3, and a bare major can resolve below it.
  NODE_VERSION: '^22.22.3'
  BUILD_CHANNEL: Production

jobs:
  e2e:
    name: ${{ inputs.os == 'linux' && 'Core E2E' || format('Core E2E ({0})', inputs.os) }}
    runs-on: ${{ fromJSON('{"linux":"blacksmith-2vcpu-ubuntu-2404","windows":"blacksmith-2vcpu-windows-2025","macos":"blacksmith-6vcpu-macos-26"}')[inputs.os] }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-e2e-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-e2e-${{ runner.os }}-

      - name: Build production UIs
        working-directory: ui
        run: |
          npm ci
          npm run build
          npm run build:web-client

      - name: Stage production host
        if: inputs.os != 'windows'
        env:
          RID: ${{ inputs.os == 'macos' && 'osx-arm64' || 'linux-x64' }}
        run: ./ci/scripts/stage-host.sh "$RID" "3.0.0-e2e.${{ github.run_number }}" "${{ env.BUILD_CHANNEL }}"

      - name: Stage production host (Windows)
        if: inputs.os == 'windows'
        shell: pwsh
        run: ./ci/scripts/stage-host.ps1 win-x64 "3.0.0-e2e.${{ github.run_number }}" "${{ env.BUILD_CHANNEL }}"

      # Only the Linux runner lacks the browser's system libraries.
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          if [[ "$RUNNER_OS" == Linux ]]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      # Plays the bootstrapper's part for every spec file: each starts its own staged host with its own
      # data directory, ports, temp directory and loopback secret. host.js picks the staged binary per OS.
      - name: Run Playwright E2E tests
        working-directory: e2e
        env:
          E2E_RUN_DIR: ${{ runner.temp }}/e2e-run
          E2E_SECRETS_FILE: ${{ runner.temp }}/e2e-loopback-secrets.txt
          SUITE: ${{ inputs.suite }}
          FILTER: ${{ inputs.filter }}
        run: |
          args=()
          if [[ "$SUITE" == "smoke" ]]; then
            args+=(--grep '@smoke')
          fi
          if [[ -n "$FILTER" ]]; then
            args+=("$FILTER")
          fi
          npx playwright test "${args[@]}"

      # Only the host and supervisor logs leave the run directory: the data directories hold key material.
      - name: Collect host logs
        if: always()
        run: |
          mkdir -p e2e/host-logs
          run_dir=$(cd "$RUNNER_TEMP/e2e-run" 2>/dev/null && pwd) || exit 0
          for log in "$run_dir"/*/macro-deck-host*.log; do
            [[ -f "$log" ]] || continue
            cp "$log" "e2e/host-logs/$(basename "$(dirname "$log")")-$(basename "$log")"
          done

      - name: Redact Playwright diagnostics
        id: redact
        if: always()
        env:
          E2E_PASSWORD: macro-deck-e2e-password
          E2E_SECRETS_FILE: ${{ runner.temp }}/e2e-loopback-secrets.txt
        # Windows may only answer to python, or ship a python3 that is just a Store placeholder.
        run: |
          python=python3
          if ! "$python" -c 'import sys' >/dev/null 2>&1; then
            python=python
          fi
          "$python" e2e/scripts/redact-playwright-artifacts.py e2e/test-results e2e/playwright-report e2e/host-logs

      - name: Upload E2E diagnostics
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.os == 'linux' && format('e2e-diagnostics-{0}', github.run_id) || format('e2e-diagnostics-{0}-{1}', inputs.os, github.run_id) }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/host-logs/

      - name: Write run summary
        if: always()
        run: |
          {
            echo '## Macro Deck E2E'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- OS: \`${{ inputs.os }}\`"
            echo "- Suite: \`${{ inputs.suite }}\`"
            echo "- Filter: \`${{ inputs.filter || 'none' }}\`"
            echo "- Data root: one isolated host per spec file under the runner temp directory"
            echo "- Host build channel: \`${{ env.BUILD_CHANNEL }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
