name: Docs

# Rebuilds the plugin documentation site whenever the SDK, the protocol, the UI model
# or the documentation itself changes, and on demand. Deployment to the production
# Cloudflare Worker is a manual step: run this workflow from main with "Deploy" enabled.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the built site to https://docs.macro-deck.app'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'sdk/src/**'
      - 'protocol/src/**'
      - 'ui-model/src/**'
      - '.github/workflows/docs.yml'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Astro 7 requires >=22.12.0, so this is pinned tighter than the repo-wide NODE_VERSION.
  NODE_VERSION: '22.12'

jobs:
  build:
    name: Build documentation site
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      # starlight-links-validator fails the build on any broken internal link.
      - name: Build
        run: npm run build
        working-directory: docs

      - name: Upload site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: docs/dist
          if-no-files-found: error

  deploy:
    name: Deploy documentation site
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    environment: production
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site
          path: docs/dist

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: deploy
